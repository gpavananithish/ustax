<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="15" fill="url(#bgGrad)" />
  <!-- Subtle border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Mortgage Roofline -->
  <path d="M32 12 L13 27.5 L16.5 30.5 L32 18 L47.5 30.5 L51 27.5 Z" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Chimney -->
  <path d="M42 16.5 L42 24.5 L46 27.5 L46 16.5 Z" fill="#bfdbfe" />

  <!-- Foundation Bars (Form 1098 / Deduction) -->
  <rect x="20" y="32" width="6" height="17" rx="2" fill="#cbd5e1" />
  <rect x="29" y="27" width="6" height="22" rx="2" fill="url(#accentGrad)" />
  <rect x="38" y="22" width="6" height="27" rx="2" fill="#ffffff" filter="url(#shadow)" />

  <!-- Foundation Floor Base -->
  <rect x="16" y="48" width="32" height="3" rx="1.5" fill="#ffffff" />
</svg>
